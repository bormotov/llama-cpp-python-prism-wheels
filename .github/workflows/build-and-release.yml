# Build and publish llama-cpp-python wheels for the PrismML llama.cpp fork.
#
# Triggers:
#   - push of a tag matching 'prism-b*'   (e.g. prism-b10743-adfffbe-v1)
#   - workflow_dispatch with an explicit fork tag
#
# Outputs: a GitHub Pages PEP 503 index at /whl/<backend>/ so consumers can do
#   pip install --extra-index-url https://<user>.github.io/<repo>/whl/prism-metal/ llama-cpp-python

name: Build PrismML Wheels

on:
  push:
    tags:
      - 'prism-b*'
  workflow_dispatch:
    inputs:
      prism_tag:
        description: 'PrismML llama.cpp tag (e.g. prism-b10743-adfffbe)'
        required: true
        type: string
      llama_cpp_python_version:
        description: 'llama-cpp-python version to build (e.g. 0.3.35)'
        required: true
        default: '0.3.35'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "prism-wheels-${{ github.ref }}"
  cancel-in-progress: true

env:
  LLAMA_CPP_PYTHON_VERSION: ${{ github.event.inputs.llama_cpp_python_version || '0.3.35' }}
  # On tag pushes the ref is a *release* tag of this repo (prism-b10743-adfffbe-v1),
  # not the fork tag, so the fork tag must be supplied explicitly. workflow_dispatch
  # always supplies it.
  PRISM_LLAMA_CPP_TAG: ${{ github.event.inputs.prism_tag || 'prism-b10743-adfffbe' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Metal (macOS ARM64)
            os: macos-latest
            artifact: wheel-metal
            backend: prism-metal
            cmake_args: >-
              -DGGML_METAL=ON
              -DGGML_METAL_EMBED_LIBRARY=ON
              -DGGML_NATIVE=ON
              -DLLAMA_BUILD_TESTS=OFF
              -DLLAMA_BUILD_EXAMPLES=OFF
              -DLLAMA_BUILD_TOOLS=OFF
              -DLLAMA_CURL=OFF
          - name: CPU (macOS ARM64)
            os: macos-latest
            artifact: wheel-cpu
            backend: prism-cpu
            cmake_args: >-
              -DGGML_METAL=OFF
              -DGGML_NATIVE=ON
              -DLLAMA_BUILD_TESTS=OFF
              -DLLAMA_BUILD_EXAMPLES=OFF
              -DLLAMA_BUILD_TOOLS=OFF
              -DLLAMA_CURL=OFF
          - name: CPU (Linux x86_64)
            os: ubuntu-latest
            artifact: wheel-linux-cpu
            backend: prism-linux-cpu
            apt_deps: cmake ninja-build libopenblas-dev python3-venv
            cmake_args: >-
              -DGGML_BLAS=ON
              -DGGML_BLAS_VENDOR=OpenBLAS
              -DGGML_NATIVE=OFF
              -DLLAMA_BUILD_TESTS=OFF
              -DLLAMA_BUILD_EXAMPLES=OFF
              -DLLAMA_BUILD_TOOLS=OFF
              -DLLAMA_CURL=OFF
    steps:
      - name: Install system deps
        if: matrix.apt_deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ${{ matrix.apt_deps }}

      # Python is needed *before* the patch step, which runs a verification
      # script. ubuntu-latest's system python3 is present but not guaranteed to
      # match, and macOS runners have no python3 until setup-python runs.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # `path:` is required here. Without it llama-cpp-python lands at the
      # workspace root and the next step's nested path silently creates a
      # *different*, empty directory tree alongside it.
      - name: Checkout llama-cpp-python
        uses: actions/checkout@v4
        with:
          repository: abetlen/llama-cpp-python
          ref: v${{ env.LLAMA_CPP_PYTHON_VERSION }}
          path: llama-cpp-python
          submodules: false
          fetch-depth: 1

      # The fork has no submodules of its own (its .gitmodules is empty), so a
      # plain clone into the submodule slot is enough. Using `git clone` rather
      # than a second actions/checkout avoids that action's path bookkeeping.
      - name: Clone PrismML llama.cpp fork
        run: |
          set -euo pipefail
          mkdir -p llama-cpp-python/vendor/llama.cpp
          git clone --depth 1 --branch "$PRISM_LLAMA_CPP_TAG" \
            https://github.com/PrismML-Eng/llama.cpp.git \
            llama-cpp-python/vendor/llama.cpp
          git -C llama-cpp-python/vendor/llama.cpp log --oneline -1
          git -C llama-cpp-python/vendor/llama.cpp rev-parse HEAD

      - name: Checkout build scripts
        uses: actions/checkout@v4
        with:
          path: ci
          sparse-checkout: scripts
          sparse-checkout-cone-mode: true

      - name: Patch binding and set version
        run: |
          set -euo pipefail
          python3 ci/scripts/prepare_llama_cpp_python.py \
            llama-cpp-python \
            "$LLAMA_CPP_PYTHON_VERSION" \
            "$PRISM_LLAMA_CPP_TAG"

      - name: Install build deps
        run: |
          set -euo pipefail
          pip install -U pip uv
          pip install scikit-build-core ninja cmake packaging

      - name: Build wheel
        env:
          CMAKE_ARGS: ${{ matrix.cmake_args }}
        run: |
          set -euo pipefail
          cd llama-cpp-python
          uv build --wheel --out-dir "../dist" .
          ls -la ../dist

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.whl
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish to GitHub Pages
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: write
    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4
        with:
          path: ci
          sparse-checkout: scripts
          sparse-checkout-cone-mode: true

      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: wheels
          pattern: wheel-*
          merge-multiple: false

      - name: Stage Pages tree
        run: |
          set -euo pipefail
          ls -R wheels
          mkdir -p public/whl/prism-metal public/whl/prism-cpu public/whl/prism-linux-cpu
          cp wheels/wheel-metal/*.whl       public/whl/prism-metal/
          cp wheels/wheel-cpu/*.whl         public/whl/prism-cpu/
          cp wheels/wheel-linux-cpu/*.whl   public/whl/prism-linux-cpu/

      - name: Generate PEP 503 index.html
        run: |
          set -euo pipefail
          python3 ci/scripts/gen_index.py public

      # This repo's Pages source is set to "GitHub Actions" (build_type:
      # workflow), so the official upload-pages-artifact/deploy-pages pair is
      # required. Pushing to a gh-pages branch (peaceiris/actions-gh-pages)
      # would publish a commit that Pages never serves.
      #
      # Append-only: previously published wheels are downloaded from the live
      # site and re-published alongside the new ones, because consumers pin
      # exact versions and a vanished file breaks them.
      - name: Restore previously published wheels
        run: |
          set -euo pipefail
          BASE="https://bormotov.github.io/llama-cpp-python-prism-wheels"
          for backend in prism-metal prism-cpu prism-linux-cpu; do
            mkdir -p "public/whl/$backend"
            url="$BASE/whl/$backend/index.html"
            if ! curl -fsSL --max-time 30 "$url" -o "/tmp/$backend.html"; then
              echo "No existing index for $backend, starting fresh"
              continue
            fi
            n=0
            for href in $(grep -o 'href="[^"]*\.whl"' "/tmp/$backend.html" | sed 's/href="//; s/"$//'); do
              if [ -f "public/whl/$backend/$href" ]; then
                echo "  $backend: $href already rebuilt, keeping new copy"
                continue
              fi
              if curl -fsSL --max-time 300 "$BASE/whl/$backend/$href" -o "public/whl/$backend/$href"; then
                echo "  $backend: carried over $href"
                n=$((n + 1))
              else
                echo "  $backend: WARNING could not fetch $href" >&2
              fi
            done
            echo "$backend: carried over $n wheel(s)"
          done
          python3 ci/scripts/gen_index.py public

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
